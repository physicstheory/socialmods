<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeTok</title>
<style>
  :root{
    --bg:#f6f5f8; --card:#ffffff; --card-2:#f1eff4; --line:#e6e3ea; --text:#141217; --muted:#6c6775;
    --cyan:#25f4ee; --pink:#fe2c55; --accent:#fe2c55; --accent-soft:#ffe5ea; --ok:#16a34a;
    --shadow:0 1px 2px rgba(20,18,23,.04),0 8px 24px rgba(20,18,23,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d0c10; --card:#18161d; --card-2:#221f28; --line:#2c2933; --text:#f3f1f6; --muted:#9a94a5;
    --accent-soft:#3a1720; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:18px 16px 40px;max-width:560px;margin:0 auto;
    background:
      radial-gradient(120% 60% at 0% -10%, color-mix(in srgb,var(--cyan) 16%,transparent), transparent 60%),
      radial-gradient(120% 60% at 100% -10%, color-mix(in srgb,var(--pink) 14%,transparent), transparent 60%),
      var(--bg);
    background-attachment:local}
  a{color:inherit;text-decoration:none}
  .ic{width:18px;height:18px;flex:none}

  header{display:flex;align-items:center;gap:12px;padding-right:44px;margin-bottom:18px} /* room for the settings cog */
  header img{width:48px;height:48px;border-radius:12px;box-shadow:0 6px 18px rgba(254,44,85,.22)}
  /* The SafeTok wordmark: Lilita One with the icon's cyan/pink offset. */
  @font-face{font-family:"SafeTok Wordmark";src:url("/_app/fonts/LilitaOne-Regular.ttf") format("truetype");font-display:block}
  header h1{margin:0;font:400 31px/1.05 "SafeTok Wordmark",-apple-system,system-ui,sans-serif;letter-spacing:.01em;
    text-shadow:-2px -1.5px 0 var(--cyan),2px 1.5px 0 var(--pink)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-top:2px}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

  h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 4px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}

  /* Jump back in */
  .resume{display:flex;align-items:center;gap:14px;padding:14px;position:relative;overflow:hidden}
  .resume::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1.5px;pointer-events:none;
    background:linear-gradient(120deg,var(--cyan),var(--pink));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .resume .txt{min-width:0;flex:1}
  .resume small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .resume b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{flex:none;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;border-radius:99px;padding:9px 16px}

  /* App grid */
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 12px;text-align:center;min-width:0}
  .app .name{font-weight:650;font-size:14px}
  .app .st{font-size:11.5px;color:var(--muted);line-height:1.25;min-height:2.5em;display:flex;align-items:flex-start;justify-content:center}
  .app.off{opacity:.5}
  .app.off .glyph{filter:grayscale(1)}
  .glyph{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;position:relative;flex:none}
  .glyph svg{width:34px;height:34px}
  .lock{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--card);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
  .lock .ic{width:12px;height:12px}

  /* Today */
  .today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px 16px}
  .stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;margin:2px 0 8px}
  .bar{height:7px;border-radius:99px;background:var(--card-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--pink))}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:6px}

  /* Accounts */
  .acct{padding:4px 0}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .glyph{width:38px;height:38px;border-radius:11px}
  .row .glyph svg{width:22px;height:22px}
  .row .who{flex:1;min-width:0}
  .row .who b{display:block;font-size:15px}
  .row .who span{display:block;font-size:12.5px;color:var(--muted)}
  .btns{display:flex;gap:6px;flex:none}
  .btn{font-weight:650;font-size:13px;border-radius:99px;padding:7px 12px;border:1px solid var(--line);background:var(--card)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .locked{display:flex;gap:10px;align-items:flex-start;padding:14px;color:var(--muted);font-size:13.5px}
  .locked .ic{margin-top:2px}

  /* Approved accounts */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;max-width:100%}
  .chip i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;flex:none}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-size:13.5px;padding:2px 4px}
  footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}
</style></head>
<body>
  <header>
    <img src="/_app/icon.png" alt="">
    <div><h1>SafeTok</h1><span class="pill"><i></i><span id="rules"></span></span></div>
  </header>

  <section id="resumeWrap" hidden>
    <a class="card resume" id="resume"><span class="glyph" id="resumeGlyph"></span>
      <span class="txt"><small>Jump back in</small><b id="resumeTitle"></b></span><span class="go">Open</span></a>
  </section>

  <h2>Apps</h2>
  <div class="apps" id="apps"></div>

  <h2>Today</h2>
  <div class="today">
    <div class="card stat"><small>Screen time</small><b id="timeUsed"></b><div class="bar"><i id="timeBar"></i></div><div class="sub" id="timeSub"></div></div>
    <div class="card stat"><small>For You &amp; Spotlight</small><b id="fyLeft"></b><div class="bar"><i id="fyBar"></i></div><div class="sub" id="fySub"></div></div>
  </div>

  <h2>Accounts</h2>
  <div class="card acct" id="accounts"></div>

  <h2 id="creatorsHead">Approved accounts</h2>
  <div class="chips" id="creators"></div>

  <footer id="foot"></footer>
<script src="/_app/chrome-shim.js"></script>
<script src="/src/policy.js"></script>
<script src="/ui/icons.js"></script>
<script src="/_app/home.js"></script>
</body></html>
