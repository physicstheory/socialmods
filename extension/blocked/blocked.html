<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paused by SafeScroll</title>
<link rel="stylesheet" href="../ui/base.css">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
    background:radial-gradient(900px 420px at 50% -10%,var(--accent-soft),transparent 70%),var(--bg)}
  .card{max-width:420px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 32px;box-shadow:var(--shadow)}
  .em{font-size:48px;line-height:1}
  h1{font-size:22px;margin:16px 0 8px}
  p{margin:0;color:var(--muted)}
  .ask{margin-top:8px;font-size:13px}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:24px}
  .foot{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;font-size:12.5px;color:var(--muted)}
  .foot .ic{width:14px;height:14px}
  a.btn{text-decoration:none}
</style></head>
<body><div class="card">
  <div class="em" id="em">🛡️</div>
  <h1 id="title">This is turned off</h1>
  <p id="why"></p>
  <p class="ask">Think this is a mistake? Ask a parent.</p>
  <div class="actions"><a id="back" class="btn primary" hidden>Go to Following feed</a></div>
  <div class="foot"><span data-icon="shield"></span>Protected by SafeScroll</div>
</div>
<script src="../ui/icons.js"></script><script src="blocked.js"></script></body></html>
