# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: SafeScrollTok
options:
  bundleIdPrefix: com.example.safescroll   # change to your own reverse-domain id
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""                    # set in Xcode → Signing & Capabilities
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  SafeScrollTok:
    type: application
    platform: iOS
    sources:
      - path: SafeScrollTok
        excludes: ["Web/**"]
      - path: SafeScrollTok/Web             # app-only pages (home, bridge shim)
        type: folder
        buildPhase: resources
      - path: ../extension                  # the same filters, policy and settings UI as the browser extension
        type: folder
        buildPhase: resources
    info:
      path: SafeScrollTok/Info.plist
      properties:
        CFBundleDisplayName: SafeTok
        UIAppFonts: [LilitaOne-Regular.ttf]   # the SafeTok wordmark (SIL Open Font License, see Fonts/)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: TikTok and Snapchat use the camera when you record a video or send a snap.
        NSMicrophoneUsageDescription: TikTok and Snapchat use the microphone when you record a video or call.
        NSPhotoLibraryUsageDescription: Lets you choose photos and videos to post.
        NSPhotoLibraryAddUsageDescription: Lets you save photos and videos.
  SafeScrollTokUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SafeScrollTokUITests]
    dependencies:
      - target: SafeScrollTok
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SafeScrollTok
schemes:
  SafeScrollTok:
    build:
      targets:
        SafeScrollTok: all
        SafeScrollTokUITests: [test]
    test:
      targets: [SafeScrollTokUITests]
