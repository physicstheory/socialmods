<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeTok</title>
<link rel="stylesheet" href="/ui/base.css">
<style>
  body{padding:calc(env(safe-area-inset-top) + 20px) 16px 32px;max-width:560px;margin:0 auto}
  .hello{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-right:40px} /* room for the settings cog */
  .logo{width:46px;height:46px;border-radius:12px;flex:none}
  .hello h1{font-size:21px}
  .hello p{margin:0;color:var(--muted);font-size:13.5px}
  a.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text);text-decoration:none;margin-bottom:12px}
  a.tile.off{opacity:.55;pointer-events:none}
  .tile .ti{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
  .tile b{display:block;font-size:16px}
  .tile span{color:var(--muted);font-size:13px}
  .tile .go{margin-left:auto;color:var(--muted)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 0 10px}
  .creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .creator{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;min-width:0}
  .creator i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-style:normal;font-weight:700;color:var(--accent);flex:none}
  .creator span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}
  h2.service{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font-size:17px;text-transform:none;letter-spacing:-.01em;color:var(--text)}
  h2.service.first{margin-top:4px}
  .badge{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
  .badge.tiktok{background:#111;color:#fff;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  .badge.snap{background:#fffc00}
  .acct{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 4px}
  .acct .btn{padding:12px 10px;border-radius:12px;text-decoration:none;font-size:15px}
  .acct .btn.ghost{background:var(--surface)}
  .locked{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
  .locked .ic{width:15px;height:15px;margin-top:2px}
</style></head>
<body>
  <div class="hello"><img class="logo" src="/_app/icon.png" alt="SafeTok"><div><h1>What do you want to watch?</h1><p id="sub"></p></div></div>

  <h2 class="service first"><span class="badge tiktok">♪</span>TikTok</h2>
  <div id="tiles"></div>
  <div id="tiktokAccount"></div>
  <h2>Approved TikTok creators</h2>
  <div id="creators" class="creators"></div>

  <section id="snap" hidden>
    <h2 class="service"><span class="badge snap">👻</span>Snapchat</h2>
    <div id="snapTiles"></div>
    <div id="snapAccount"></div>
    <h2>Approved Snapchat accounts</h2>
    <div id="snapCreators" class="creators"></div>
  </section>
<script src="/_app/chrome-shim.js"></script>
<script src="/src/policy.js"></script>
<script src="/ui/icons.js"></script>
<script src="/_app/home.js"></script>
</body></html>
