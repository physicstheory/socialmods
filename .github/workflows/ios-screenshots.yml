# Runs the real SafeScroll iPhone app in Apple's iPhone Simulator on a GitHub Mac,
# with live TikTok inside it, and takes screenshots (plus TikTok in plain Safari
# for comparison). Results: releases/tag/app-screenshots
name: iPhone app screenshots

on:
  push:
    paths: [".github/workflows/ios-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          set -o pipefail
          xcodebuild build -project SafeScrollTok.xcodeproj -scheme SafeScrollTok -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Run scenarios and take screenshots
        working-directory: ios
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/SafeScrollTok.app
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          phones=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          pro=[x for x in phones if 'Pro' in x['name'] and 'Max' not in x['name']]
          print((pro or phones)[-1]['udid'])")
          # The simulator follows the Mac's clock. Use Melbourne time so bedtime / For You hours
          # reflect an Australian day rather than UTC.
          sudo systemsetup -settimezone Australia/Melbourne >/dev/null || true
          TZ=Australia/Melbourne date
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          run()  { xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true; xcrun simctl launch "$UDID" "$BID" "$@"; }
          # Settings are passed in at launch (--seed-store), so each scenario starts from exactly these values.
          seed() { printf '%s' "$1" | base64 | tr -d '\n'; }
          PIN='"pinSalt":"s","pinHash":"1f884ca61b18b4dcde9cc304095322b1c5b15422400c4796cf0bbadbea5f00aa"'
          LATER=$(( ($(date +%s) + 7200) * 1000 ))
          CREATORS='"friendAllowlist":["nasa","sciencesam","bakewithmia"],"snapAllowlist":["nasa","natgeo"]'
          S17=$(seed "{$PIN,\"age\":17,\"region\":\"default\",\"overrides\":{\"disableForYou\":false,$CREATORS}}")
          S17U=$(seed "{$PIN,\"age\":17,\"region\":\"default\",\"unlockedUntil\":$LATER,\"overrides\":{\"disableForYou\":false,$CREATORS}}")
          S14AU=$(seed "{$PIN,\"age\":14,\"region\":\"AU\",\"overrides\":{$CREATORS}}")
          S16AU=$(seed "{$PIN,\"age\":16,\"region\":\"AU\",\"overrides\":{$CREATORS}}")

          # 1. First launch: parent setup
          run --seed-store "$(seed '{}')" --welcome-done NO; shot 01-first-launch-setup 10

          # 2. Welcome (17, accounts allowed)
          run --seed-store "$S17" --welcome-done NO; shot 02-welcome 6

          # 3. TikTok For You inside SafeScroll (17, For You on with limits)
          run --seed-store "$S17" --welcome-done YES; shot 03-app-tiktok-foryou 25

          # 4. The same page in plain Safari, for comparison
          xcrun simctl terminate "$UDID" "$BID" || true
          xcrun simctl openurl "$UDID" "https://www.tiktok.com/foryou" || true; shot 04-safari-tiktok-foryou 25
          xcrun simctl terminate "$UDID" com.apple.mobilesafari || true

          # 5. Settings sheet (cog), unlocked
          run --seed-store "$S17U" --welcome-done YES --show-settings; shot 05-app-settings 10

          # 6. 14 in Australia: no account, approved creators, login blocked
          run --seed-store "$S14AU" --welcome-done YES; shot 06-app-home-14-australia 10
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.tiktok.com/@nasa"; shot 07-app-approved-creator 25
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.tiktok.com/foryou"; shot 08-app-foryou-off-14-australia 15
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.tiktok.com/login"; shot 09-app-login-blocked-14-australia 12

          # 7. Snapchat
          run --seed-store "$S17" --welcome-done YES --open "https://www.snapchat.com/spotlight"; shot 10-app-snapchat-spotlight-17 20
          xcrun simctl terminate "$UDID" "$BID" || true
          xcrun simctl openurl "$UDID" "https://www.snapchat.com/spotlight" || true; shot 11-safari-snapchat-spotlight 20
          xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.snapchat.com/add/nasa"; shot 12-app-snapchat-approved-account-14 18
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.snapchat.com/spotlight"; shot 13-app-snapchat-spotlight-off-14 12
          run --seed-store "$S14AU" --welcome-done YES --open "https://web.snapchat.com/"; shot 14-app-snapchat-chat-blocked-14 12
          run --seed-store "$S14AU" --welcome-done YES --open "https://map.snapchat.com/"; shot 15-app-snap-map-blocked-14 12
          run --seed-store "$S14AU" --welcome-done YES; xcrun simctl io "$UDID" screenshot /dev/null; sleep 8
          shot 16-app-home-with-snapchat-14 2

          # 8. 16 in Australia: sign in / create an account buttons for TikTok and Snapchat
          run --seed-store "$S16AU" --welcome-done YES --open "safescroll://app/_app/home.html"; shot 17-app-home-accounts-16-australia 10
          # Snapchat opens for the 14-year-old even with Spotlight off
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.snapchat.com/"; shot 18-app-snapchat-home-14 20

          # 9. The phone in Dark mode: SafeScroll's pages follow it, the strips match the page
          xcrun simctl ui "$UDID" appearance dark || true
          run --seed-store "$S16AU" --welcome-done YES --open "safescroll://app/_app/home.html"; shot 19-app-home-dark-mode 10
          run --seed-store "$S17" --welcome-done YES; shot 20-app-tiktok-foryou-dark-mode 25
          run --seed-store "$S17" --welcome-done YES --open "https://www.snapchat.com/spotlight"; shot 21-app-snapchat-spotlight-dark-mode 20
          xcrun simctl ui "$UDID" appearance light || true

          # 10. Threads and the Meta apps at 16 (signed out: their own log-in pages), inside SafeTok
          run --seed-store "$S16AU" --welcome-done YES --open "https://www.instagram.com/"; shot 23-app-instagram-16 20
          run --seed-store "$S16AU" --welcome-done YES --open "https://www.threads.com/"; shot 24-app-threads-16 20
          run --seed-store "$S16AU" --welcome-done YES --open "https://m.facebook.com/"; shot 25-app-facebook-16 20

          # 11. Reopens where you left off: open a creator's page, close the app, open it again (no --open)
          run --seed-store "$S14AU" --welcome-done YES --open "https://www.tiktok.com/@nasa"; sleep 20
          xcrun simctl terminate "$UDID" "$BID" || true
          xcrun simctl launch "$UDID" "$BID" --welcome-done YES; shot 26-app-reopens-last-page 20
          run --seed-store "$S16AU" --welcome-done YES --open "https://www.tiktok.com/@nasa"; sleep 20
          xcrun simctl terminate "$UDID" "$BID" || true
          xcrun simctl launch "$UDID" "$BID" --welcome-done YES --open "safescroll://app/_app/home.html"; shot 27-app-home-jump-back-in 10

          # 12. Snapchat's full web app (chat and snaps) at 16, laid out for the phone (signed out: its log-in page)
          run --seed-store "$S16AU" --welcome-done YES --open "https://web.snapchat.com/"; shot 22-app-snapchat-web-16 25
          # Adding a friend: their Snapchat page opens as the desktop site (Add Friend works when signed in)
          run --seed-store "$S16AU" --welcome-done YES --open "https://www.snapchat.com/add/nasa"; shot 28-app-snapchat-add-friend-16 20
          ls -la shots

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          gh release delete app-screenshots --cleanup-tag --yes || true
          gh release create app-screenshots shots/*.png --target "$GITHUB_SHA" --latest=false --prerelease \
            --title "SafeScroll iPhone app screenshots" --notes "Real app in Apple's iPhone Simulator with live TikTok."
