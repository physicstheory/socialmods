<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeScroll</title>
<link rel="stylesheet" href="/ui/base.css">
<style>
  body{padding:calc(env(safe-area-inset-top) + 20px) 16px 32px;max-width:560px;margin:0 auto}
  .hello{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
  .logo .ic{width:22px;height:22px}
  .hello h1{font-size:21px}
  .hello p{margin:0;color:var(--muted);font-size:13.5px}
  a.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text);text-decoration:none;margin-bottom:12px}
  a.tile.off{opacity:.55;pointer-events:none}
  .tile .ti{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
  .tile b{display:block;font-size:16px}
  .tile span{color:var(--muted);font-size:13px}
  .tile .go{margin-left:auto;color:var(--muted)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 0 10px}
  .creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .creator{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;min-width:0}
  .creator i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-style:normal;font-weight:700;color:var(--accent);flex:none}
  .creator span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:16px;text-align:center}
  .note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12.5px;margin-top:20px}
  .note .ic{width:15px;height:15px;margin-top:2px}
</style></head>
<body>
  <div class="hello"><div class="logo" data-icon="shield"></div><div><h1>What do you want to watch?</h1><p id="sub"></p></div></div>
  <div id="tiles"></div>
  <h2>Approved creators</h2>
  <div id="creators" class="creators"></div>
  <div id="note" class="note"></div>
<script src="/_app/chrome-shim.js"></script>
<script src="/src/policy.js"></script>
<script src="/ui/icons.js"></script>
<script src="/_app/home.js"></script>
</body></html>
